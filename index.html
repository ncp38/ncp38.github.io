  class="theme-toggle"

  aria-pressed="false"
>

<!--<section id="compoundFilters" aria-label="Grouped filters"></section>-->

<div class="filter-controls">

<button
    id="filterToggle"
    class="filter-toggle"
    type="button"
    aria-expanded="false"
    aria-controls="filterPanel"
  >

    <span
      id="filterCount"
      class="filter-count"
      aria-hidden="true"
    ></span>
  </button>

    id="filterPanel"
    class="filter-panel"
  >
