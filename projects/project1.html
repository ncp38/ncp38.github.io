<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title id="page-title">Project Title One</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../assets/style.css">

<body>

<a href="../index.html">← Back</a>

<h1>Project Title One</h1>
<p><strong>Year:</strong> 2024</p>

<p>
  Full description of the project, motivation, methods,
  results, figures, links to code or papers.
</p>

<a href="#">GitHub</a> | <a href="#">Paper</a>

<script>
  // Imports project info stored in constants.js
  import { PROJ1TITLE, PROJ1KEYWORDS, PROJ1YEAR, PROJ1DESCRIPTION } from './constants.js'; 
  
  document.getElementById('page-title').textContent = PROJ1TITLE;

  // Get the 'ref' query param
  const params = new URLSearchParams(window.location.search);
  const ref = params.get("ref");

  if (ref) {
    // Create a back link to the filtered view
    const backLink = document.createElement("a");
    backLink.href = decodeURIComponent(ref);
    backLink.textContent = "← Back to filtered results";
    backLink.style.display = "inline-block";
    backLink.style.marginBottom = "20px";

    document.body.insertBefore(backLink, document.body.firstChild);
  } else {
    // Fallback: normal back to index
    const backLink = document.createElement("a");
    backLink.href = "../index.html";
    backLink.textContent = "← Back to all projects";
    backLink.style.display = "inline-block";
    backLink.style.marginBottom = "20px";

    document.body.insertBefore(backLink, document.body.firstChild);
  }
</script>
</body>
</html>
