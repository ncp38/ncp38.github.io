function getTime(xLength, value)
{
    var numMonths = startDate.getMonth();
    var numYears = startDate.getYear();

    value = value + totalX[xLength];

    while(value + numMonths >= 12)
    {
        numYears++;
        value = value -12;
    }
    numMonths = numMonths + value;

    var result = new Date(numYears, numMonths, 1);

    return result;
}

function initializeData()
{ 
    //This code segment comes from: http://stackoverflow.com/questions/6861180/how-can-you-read-a-file-line-by-line-in-javascript .
    var txtFile = new XMLHttpRequest();
    txtFile.open("GET", path, true);
    txtFile.onreadystatechange = function()
    {
      if (txtFile.readyState === 4) 
      {  // document is ready to parse.
        if (txtFile.status === 200) 
        {  // file is found
          allText = txtFile.responseText; //alert("File found");
          lines = txtFile.responseText.split("\n"); //alert("Here is the first line: " + lines[0]); 
          draw();
        }
        else
        {
          alert("File not found");
        }
      }
    }
    txtFile.send(null);
    //draw();
}

d.onclick = function(e)
{
    var startString=prompt("Specify the starting month and year that you wish to view, from 0 to 11, and from 1947 to 2013, respectively.\nList the year first, followed by a space, and then the month.","1");
    totalX = [];
    if(startString.indexOf(" ") > -1)
    {
        var inputArray = startString.split(' ');
        startYear = inputArray[0];
        startMonth = inputArray[1];
    }
    else
    {
        startYear = startString;
        startMonth = 1;
    }
    //var startMonth=prompt("Specify the starting month that you wish to view, 0 to 11","1");
    startDate= new Date(startYear, startMonth, 1);

    //var endYear=prompt("Specify the ending year that you wish to view, from " + startYear + " to 2013.","1");
    var endString=prompt("Specify the ending month and year that you wish to view, from 0 to 11, and from " + startYear + " to 2013, respectively.\nList the year first, followed by a space, and then the month.","1");
    if(endString.indexOf(" ") > -1)
    {
        var inputArray = endString.split(' ');
        endYear = inputArray[0];
        endMonth = inputArray[1];
    }
    else
    {
        endYear = endString;
        endMonth = 1;
    }
    while(endYear < startYear)
    {
        var endYear=prompt("Invalid value.\nPlease specify the ending year that you wish to view, from " + startYear + " to 2013.","1");
    }
    //var endMonth=prompt("Specify the ending month that you wish to view, 0 to 11","1");
    endDate= new Date(endYear, endMonth, 1);

    var result = "Select Dates:<br/>1/" + startMonth + "/" + startYear + " to<br/>1/" + endMonth + "/" + endYear;
    d.innerHTML = result;
    initializeData();
}

v.onclick = function(e)

        v.innerHTML="Select Graph:<br/>Circle Graph"
    }

}
